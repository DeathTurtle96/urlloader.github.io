<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link

      rel="stylesheet"
    />

    <title>The URL Loader</title>
    <style>
      * {
        font-family: sans-serif;
        color: white;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: black;
      }

      .modal {
        background-color: #222;
        color: white;
      }

      /* #region Navigation Bar */
      nav {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 50px;
        background-color: #222;
        border-bottom: 1px solid #444;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        z-index: 998;
        box-shadow: 0 2px 25px rgba(255, 0, 0, 0.6);
      }

      nav .dropdown {
        position: relative;
        display: inline-block;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      nav #advanced {
        height: 100%;
      }

      nav button {
        background-color: #222;
        font-weight: bold;
        transition: background-color 200ms ease;
        color: white;
        border: none;
        padding: 10px 25px;
        cursor: pointer;
        font-size: 16px;
        height: 100%;
      }

      nav input[type="radio"] {
        display: none;
      }

      nav span {
        user-select: none;
      }

      nav ul.dropdown-menu {
        margin: 0;
        padding: 0;
        width: 100%;
        list-style: none;
        position: absolute;
        top: 100%;
        left: 0;
        overflow: hidden;
        transform: scaleY(0);
        transform-origin: top;
        transition: transform 200ms ease;
        overflow-y: auto;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
      }

      nav ul.dropdown-menu {
        display: flex;
        flex-direction: column;
        margin: 0;
      }

      nav ul.dropdown-menu label {
        padding: 10px 15px;
        width: auto;
        text-align: center;
        cursor: pointer;
        background-color: #333;
        transition: background-color 200ms ease;
      }

      nav ul.dropdown-menu label:hover {
        background-color: #444;
      }

      nav button:hover {
        background-color: #333;
      }

      nav .dropdown:hover ul.dropdown-menu {
        transform: scaleY(1);
      }

      nav ul.dropdown-menu input[type="radio"]:checked + span.custom-radio {
        font-weight: bold;
        text-decoration: underline;
        text-shadow: 0 0 10px green;
      }

      nav ul.dropdown-menu#bookmarks label[aria-disabled="true"] {
        pointer-events: none;
        cursor: not-allowed;
      }

      nav ul.dropdown-menu label input:disabled + span.custom-radio {
        pointer-events: none;
        color: #888;
        cursor: not-allowed;
      }

      nav ul.dropdown-menu label:has(> input:disabled) {
        cursor: not-allowed;
      }

      nav
        ul.dropdown-menu
        #bookmarks
        label[aria-disabled="true"]
        span.custom-radio {
        pointer-events: none;
        color: #888;
        cursor: not-allowed;
      }

      nav ul.dropdown-menu#bookmarks label span.delete-btn {
        background-color: transparent;
        transition: background-color 200ms ease;
      }

      nav ul.dropdown-menu#bookmarks label span.delete-btn:hover {
        background-color: #555;
      }

      nav input#admin-pw {
        padding: 5px;
        width: 200px;
        margin: auto 10px;
        background-color: #333;
        border: 1px solid #444;
        outline: none;
        transition: border-color 500ms ease, box-shadow 500ms ease;
      }

      nav input#admin-pw:hover {
        border-color: #666;
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
      }

      nav input#admin-pw:focus {
        border-color: white;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
      }

      nav #the-dot {
        width: 10px;
        height: 10px;
        border-radius: 5px;
        margin-left: auto;
        margin-right: 15px;
        box-shadow: 0 0 5px red, 0 0 10px red, 0 0 15px red;
        background-color: red;
        transition: box-shadow 300ms linear, background-color 300ms linear;
      }

      nav #the-dot[title="Connected to server"] {
        box-shadow: 0 0 5px green, 0 0 10px green, 0 0 15px green;
        background-color: green;
      }
      /* #endregion */

      /* #region URL Bar */
      #url-bar-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: auto;
      }

      #url-bar-container h1 {
        text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      }

      input#url-bar {
        width: 60vw;
        height: 40px;
        border-radius: 20px;
        padding: 10px;
        font-size: 16px;
        border: 1px solid #444;
        background-color: #111;
        color: white;
        transition: border-color 500ms ease, box-shadow 500ms ease;
        outline: none;
      }

      input#url-bar:hover {
        border-color: #666;
        box-shadow: 0 0 12px rgba(255, 0, 0, 0.6);
      }

      input#url-bar:focus {
        border-color: white;
        box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
      }

      input#url-bar:disabled {
        background-color: #333;
        color: #888;
        cursor: wait;
      }
      /* #endregion */
    </style>
  </head>
  <body>
    <nav>
      <!-- URL Handling Mode -->
      <div class="dropdown">
        <button>Mode</button>
        <ul class="dropdown-menu">
          <label>
            <input type="radio" name="mode" value="Embed" checked />
            <span class="custom-radio">Embed</span>
          </label>
          <label>
            <input
              type="radio"
              name="mode"
              value="Proxy"
              id="proxy-btn"
              disabled
            />
            <span class="custom-radio">Proxy (WIP)</span>
          </label>
        </ul>
      </div>
      <!-- Bookmarks -->
      <div class="dropdown">
        <button>Bookmarks</button>
        <ul class="dropdown-menu" id="bookmarks">
          <label id="new-bookmark">
            <span
              class="custom-radio"
              style="font-style: italic"
              name="create-bookmark"
            >
              Create New Bookmark...
            </span>
          </label>
        </ul>
      </div>
      <!-- Advanced Feature Container -->
      <div id="advanced"></div>
      <!-- Admin Panel -->
      <input type="password" id="admin-pw" placeholder="Admin Panel" />
      <!-- Online/Offline Status -->
      <div id="the-dot" title="Not connected to server"></div>
    </nav>

    <div id="url-bar-container">
      <h1>The URL Loader</h1>
      <input type="text" id="url-bar" placeholder="Enter your URL here!" />
    </div>

    <!-- An access code is required for the advanced content to show up. See it in "adv.html". -->

    <!-- Initialization -->
    <script>
      const urlBar = document.querySelector("input#url-bar");
      urlBar.focus();

      const SERVER_URL = "http://96.227.220.36:3000/";

      // #region Saving URL Mode
      if (!window.localStorage.getItem("url-loader:url-mode")) {
        window.localStorage.setItem("url-loader:url-mode", "embed");
      }

      const mode = window.localStorage.getItem("url-loader:url-mode");
      const modeRadios = document.querySelectorAll("nav input[name='mode']");
      modeRadios[0].addEventListener("change", () => {
        if (modeRadios[0].checked) {
          window.localStorage.setItem("url-loader:url-mode", "embed");
        }
      });
      modeRadios[1].addEventListener("change", () => {
        if (modeRadios[1].checked) {
          window.localStorage.setItem("url-loader:url-mode", "proxy");
        }
      });

      switch (mode) {
        case "embed":
          modeRadios[0].checked = true;
          break;
        case "proxy":
          modeRadios[1].checked = true;
      }
      // #endregion

      window.addEventListener("beforeunload", (e) => {
        e.preventDefault();
        e.returnValue = "";
      });
      document.addEventListener("DOMContentLoaded", () => {
        window.originalDocument = window.opener
          ? window.opener.originalDocument
          : document.documentElement.cloneNode(true);
      });
    </script>

    <!-- Modal Patching -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      window.alert = async (title, text) => {
        await Swal.fire({
          title,
          text,
          confirmButtonText: "OK",
          heightAuto: false,
          customClass: {
            popup: "modal",
          },
        });
      };
      window.alertErr = async (title, text) => {
        await Swal.fire({
          icon: "error",
          title,
          text,
          confirmButtonText: "OK",
          heightAuto: false,
          customClass: {
            popup: "modal",
          },
        });
      };
      window.confirm = async (title, text) => {
        const result = await Swal.fire({
          title,
          text,
          showCancelButton: true,
          confirmButtonText: "OK",
          heightAuto: false,
          customClass: {
            popup: "modal",
          },
        });
        return result.isConfirmed;
      };
      window.prompt = async (title, text) => {
        const result = await Swal.fire({
          title,
          text,
          input: "text",
          inputPlaceholder: "Enter text...",
          showCancelButton: true,
          heightAuto: false,
          customClass: {
            popup: "modal",
          },
        });
        if (result.isConfirmed) {
          return result.value;
        }
      };
    </script>

    <!-- URL Handling(direct type-in) -->
    <script>
      async function openURL(url) {
        url = url.trim();
        ogUrl = url;
        if (!url) return;

        if (!url.startsWith("http://") && !url.startsWith("https://")) {
          url = "https://" + url;
        }

        const bookmarkBtns = document.querySelectorAll("#bookmarks label");
        bookmarkBtns.forEach((btn) => {
          btn.setAttribute("aria-disabled", true);
          btn.style.pointerEvents = "none";
        });
        urlBar.disabled = true;
        urlBar.value = "Loading...";

        let isValid = false;
        try {
          const response = await fetch(url, {
            method: "GET",
            mode: "no-cors",
          });

          isValid = true;
        } catch (error) {
          isValid = false;
        }

        if (!isValid) {
          url =
            "https://www.google.com/search?igu=1&q=" +
            encodeURIComponent(ogUrl);
        }

        const newWindow = window.open("about:blank", "_blank");

        const embeddedPage = document.createElement("embed");
        embeddedPage.src = url;
        embeddedPage.type = "text/html";
        embeddedPage.style.width = "100vw";
        embeddedPage.style.height = "100vh";
        embeddedPage.style.border = "none";
        newWindow.document.body.style.margin = "0";

        newWindow.document.body.appendChild(embeddedPage);
        newWindow.document.title = "Loaded URL: " + url;

        const iconLink = document.createElement("link");
        iconLink.rel = "icon";
        newWindow.document.head.append(iconLink);

        eval(window.sessionStorage.getItem("url-loader:cloaknewtab"));

        newWindow.addEventListener("beforeunload", (e) => {
          e.preventDefault();
          e.returnValue = "";
        });
        bookmarkBtns.forEach((btn) => {
          btn.setAttribute("aria-disabled", false);
          btn.style.pointerEvents = "auto";
        });
        urlBar.disabled = false;
        urlBar.value = "";
        urlBar.blur();
      }

      urlBar.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          openURL(urlBar.value);
        }
      });
    </script>

    <!-- Bookmarks -->
    <script>
      const bmKey = "url-loader:bookmark:";
      const bookmarks = document.querySelector("#bookmarks");
      let bookmarkNames = [];
      for (let i = 0; i < localStorage.length; i++) {
        let key = localStorage.key(i);
        if (key.startsWith(bmKey)) {
          key = key.replace(bmKey, "");
          bookmarkNames.push(key);
          const value = localStorage.getItem(bmKey + key);
          const label = document.createElement("label");
          label.name = "bookmark";
          label.innerHTML = `<span class="custom-radio">${key}</span><span class="delete-btn material-icons" title="Delete Bookmark">delete</span>`;
          label.addEventListener("click", () => {
            console.log("Opening bookmark:", value);
            openURL(value);
          });
          bookmarks.prepend(label);
          key = bmKey + key;
          label
            .querySelector(".delete-btn")
            .addEventListener("click", async (e) => {
              e.stopPropagation();
              if (
                await confirm("Are you sure you want to delete this bookmark?")
              ) {
                localStorage.removeItem(key);
                label.remove();
                bookmarkNames = bookmarkNames.filter((bm) => bm !== name);
              }
            });
        }
      }
      document
        .querySelector("#new-bookmark")
        .addEventListener("click", async () => {
          const name = await window.prompt("Enter bookmark name:");
          if (name) {
            const url = await window.prompt("Enter bookmark URL:");
            if (url) {
              let exists = false;
              bookmarkNames.forEach((bm) => {
                if (bm === name) {
                  exists = true;
                }
              });
              if (
                exists &&
                !(await confirm(
                  "Bookmark with this name already exists.",
                  "Do you want to overwrite it?"
                ))
              ) {
                await alert("Bookmark canceled.");
                return;
              } else {
                const els = document.querySelectorAll("nav #bookmarks span");
                for (let el of els) {
                  if (el.textContent === name) {
                    el.parentElement.remove();
                  }
                }
              }
              const key = bmKey + name;
              localStorage.setItem(key, url);
              const label = document.createElement("label");
              label.name = "bookmark";
              label.innerHTML = `<span class="custom-radio">${name}</span><span class="delete-btn material-icons" title="Delete Bookmark">delete</span>`;
              label.addEventListener("click", () => {
                openURL(url);
              });
              bookmarkNames.push(name);
              bookmarks.prepend(label);
              label
                .querySelector(".delete-btn")
                .addEventListener("click", async (e) => {
                  e.stopPropagation();
                  if (
                    await confirm(
                      "Are you sure you want to delete this bookmark?"
                    )
                  ) {
                    localStorage.removeItem(key);
                    label.remove();
                    bookmarkNames = bookmarkNames.filter((bm) => bm !== name);
                  }
                });
            } else {
              await alert("Bookmark URL cannot be empty.");
            }
          }
        });
    </script>

    <!-- Importing Advanced Features(from server) -->
    <script type="module">
      import io from "https://cdn.socket.io/4.7.5/socket.io.esm.min.js";
      const statusDot = document.querySelector("#the-dot");

      window.socket = io(`${SERVER_URL}`, {
        auth: {
          token: window.localStorage.getItem("url-loader:authtoken"),
        },
      });

      window.socket.on("connect_error", (err) => {
        if (err.message.startsWith("no-reconnect:")) {
          window.socket.io.opts.reconnection = false;
          console.log(`Cannot use advanced features.\nError: ${err.message}`);
        }
      });

      window.socket.io.on("reconnect_attempt", () => {
        window.socket.auth.token = window.localStorage.getItem(
          "url-loader:authtoken"
        );
      });

      window.socket.on("welcome", (data) => {
        console.log("Connected to server!");
        console.log(`Welcome token: ${data.data}`);
        window.localStorage.setItem("url-loader:authtoken", data.data);
        window.socket.emit("verify-token", { token: data.data });
        statusDot.title = "Connected to server";
      });

      window.socket.on("error", (data) => {
        console.log(data.data);
      });

      window.socket.on("disconnect", () => {
        statusDot.title = "Not connected to server";
      });

      let adv = "";
      let loaded = false;
      window.socket.on("advanced-chunk", (data) => {
        adv += data.data;
      });
      window.socket.on("advanced-end", () => {
        if (!loaded) {
          const wrapper = document.querySelector("#advanced");
          wrapper.innerHTML = "";

          const temp = document.createElement("div");
          temp.innerHTML = adv;

          for (const node of temp.childNodes) {
            if (node.tagName !== "SCRIPT") {
              wrapper.appendChild(node);
            }
          }

          temp.querySelectorAll("script").forEach((oldScript) => {
            const newScript = document.createElement("script");
            if (oldScript.type) newScript.type = oldScript.type;
            if (oldScript.src) {
              newScript.src = oldScript.src;
            } else {
              newScript.textContent = oldScript.textContent;
            }
            wrapper.appendChild(newScript);
          });
          loaded = true;
        }
      });
    </script>

    <!-- Admin Commands -->
    <script>
      const password = document.querySelector("#admin-pw");
      password.addEventListener("keydown", async (e) => {
        if (e.key === "Enter") {
          const res = await fetch(`${SERVER_URL}/admin/check-pw`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              pass: password.value,
            }),
          });
          if (res.ok) {
            const input = await window.prompt("Admin command route:");
            if (!input) {
              if (input === "") {
                await alert("No command specified.");
                password.value = "";
                return;
              }
              await alert("Command canceled.");
              password.value = "";
              return;
            }
            let cmdRes;
            try {
              cmdRes = await fetch(`${SERVER_URL}/admin/${input}`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ pass: password.value }),
              });
              if (!cmdRes.ok)
                throw new Error(
                  `HTTP Error: ${cmdRes.status} ${cmdRes.statusText}`
                );
            } catch (err) {
              await window.alertErr(err.message);
            }
            const data = await cmdRes.json();
            eval(data.action);
            alert("Success:", JSON.stringify(data));
          } else {
            alert("no.");
          }
          password.value = "";
        }
      });
    </script>
  </body>
</html>
